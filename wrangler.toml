name = "seblak-pos"
main = "worker/index.ts"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

# Binding D1 sesuai kontrak G1a. Database "seblak-pos-db" dibuat 21 Nov 2026
# di akun Cloudflare pemilik (dibuat via dashboard oleh Nailong atas izin pemilik);
# database_id di bawah adalah ID aslinya.
[[d1_databases]]
binding = "DB"
database_name = "seblak-pos-db"
database_id = "6e502949-1496-4d42-9cac-d4990e1201c9"
migrations_dir = "migrations"

# Frontend (hasil `npm run build` ke dist/) disajikan dari Worker yang sama;
# rute SPA selain berkas statis & /api diteruskan ke index.html.
[assets]
directory = "dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
